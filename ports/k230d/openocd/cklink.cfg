# BPI CanMV K230D Zero / CKLink-Lite, CPU0 JTAG IDCODE 0x10000b6f.
# Requires the composite-device bulk IN endpoint fix in cklink.c.
source [find interface/cklink.cfg]
transport select jtag
adapter speed 1000
reset_config none
bindto 127.0.0.1

jtag newtap probe tap -irlen 5 -expected-id 0x10000b6f
target create probe.cpu riscv -tap probe.tap

# This probe times out on the default long automatic scan. Validate this
# known single-TAP chain with a short IDCODE read instead.
proc jtag_init {} {
    irscan probe.tap 0x01
    set idcode [drscan probe.tap 32 0]
    if {$idcode ne "10000b6f"} {
        error "Unexpected CKLink target IDCODE: $idcode (expected 10000b6f)"
    }
    echo "Verified JTAG IDCODE: 0x$idcode"
}
