# BPI CanMV K230D Zero / CH347F, CPU0 JTAG.
adapter driver ch347
adapter usb vid_pid 0x1a86 0x55de
transport select jtag
adapter speed 1875
reset_config none
bindto 127.0.0.1

jtag newtap k230d cpu0 -irlen 5 -expected-id 0x10000b6f
target create k230d.cpu0 riscv -tap k230d.cpu0
riscv set_mem_access progbuf
