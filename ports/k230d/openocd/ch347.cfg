# BPI CanMV K230D Zero / CH347F, CPU0 JTAG.
adapter driver ch347
adapter usb vid_pid 0x1a86 0x55de
transport select jtag
adapter speed 1875
reset_config none
bindto 127.0.0.1

jtag newtap k230d cpu0 -irlen 5 -expected-id 0x10000b6f
target create k230d.cpu0 riscv -tap k230d.cpu0
riscv set_mem_access progbuf

riscv expose_csrs 0xfc0=mcpuid
source [file join [file dirname [info script]] cpu-info.tcl]
k230d.cpu0 configure -event examine-end {
    if {[catch {k230d_cpu_info} message]} {
        echo "CPU identification unavailable: $message"
    }
}
