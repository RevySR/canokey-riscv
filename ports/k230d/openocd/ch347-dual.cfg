# K230D has one JTAG TAP and two Debug Modules, each with hart index 0.
if {![info exists K230D_START_CPU1]} {
    set K230D_START_CPU1 0
}
source [file join [file dirname [info script]] ch347.cfg]

target create k230d.cpu1 riscv -tap k230d.cpu0 -dbgbase 0x400 -coreid 0 -defer-examine
targets k230d.cpu1
riscv expose_csrs 0xfc0=mcpuid
riscv set_mem_access progbuf
targets k230d.cpu0

source [file join [file dirname [info script]] dual-core.tcl]
init
if {[catch {k230d_connect_cpu1 $K230D_START_CPU1} message]} {
    echo "CPU1 connection failed: $message"
}
