# YuzukiNeko F101S3 / CKLink Lite, RISC-V JTAG through the TF socket.
adapter driver cklink
adapter usb vid_pid 0x32bf 0xb210
transport select jtag
# CKLink batch replies do not capture IR. This board has one known TAP.
verify_ircapture disable
adapter speed 200
reset_config none
bindto 127.0.0.1

jtag newtap f101 cpu -irlen 5 -expected-id 0x90000b6f
target create f101.cpu riscv -tap f101.cpu
riscv set_mem_access progbuf
riscv expose_csrs 0xfc0=mcpuid
source [file join [file dirname [info script]] ../../common/openocd/cpu-info.tcl]

proc f101_cpu_info {} {
    xuantie_cpu_info f101.cpu
}

f101.cpu configure -event examine-end {
    if {[catch {f101_cpu_info} message]} {
        echo "CPU identification unavailable: $message"
    }
}

# CKLink batch replies contain DR data only and accept up to 255 bits.
proc jtag_init {} {
    irscan f101.cpu 0x01
    set idcode [drscan f101.cpu 32 0]
    echo "F101 JTAG IDCODE: $idcode"
    if {[format "0x%s" $idcode] != 0x90000b6f} {
        error "Unexpected F101 JTAG IDCODE: $idcode"
    }
}
