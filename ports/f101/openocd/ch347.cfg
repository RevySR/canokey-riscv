# YuzukiNeko F101S3 / CH347F, RISC-V JTAG through the TF socket.
adapter driver ch347
adapter usb vid_pid 0x1a86 0x55de
transport select jtag
adapter speed 1875
reset_config none
bindto 127.0.0.1

jtag newtap f101 cpu -irlen 5 -expected-id 0x90000b6f
target create f101.cpu riscv -tap f101.cpu
riscv set_mem_access progbuf
riscv expose_csrs 0xfc0=mcpuid
source [file join [file dirname [info script]] ../../common/openocd/cpu-info.tcl]

proc f101_cpu_info {} {
    xuantie_cpu_info f101.cpu
}

f101.cpu configure -event examine-end {
    if {[catch {f101_cpu_info} message]} {
        echo "CPU identification unavailable: $message"
    }
}
